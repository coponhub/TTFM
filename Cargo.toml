[package]
name = "ttfm"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
duckdb = { version = "1.0", features = ["bundled"] }
walkdir = "2.4"
anyhow = "1.0"
chrono = "0.4"
indicatif = "0.18.3"
wasmtime = { version = "28.0", features = ["component-model", "cranelift", "async"] }
wasmtime-wasi = "28.0"
wit-bindgen = "0.36.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"

[dev-dependencies]
tempfile = "3.24.0"
