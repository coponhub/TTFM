[package]
name = "ttfm"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
duckdb = { version = "1.0", features = ["bundled"] }
walkdir = "2.4"
anyhow = "1.0"
chrono = "0.4"
indicatif = "0.18.3"
wasmtime = { version = "28.0", features = ["component-model", "cranelift", "async"] }
wasmtime-wasi = "28.0"
wit-bindgen = "0.36.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
rayon = "1.11.0"
file-id = "0.2.3"
ignore = "0.4.25"
sea-query = "0.32.7"
terminal_size = "0.4.3"
path-slash = "0.2"
strum = { version = "0.26", features = ["derive"] }
rustc-hash = "2.1.1"

[dev-dependencies]
tempfile = "3.24.0"
